openapi: 3.2.0
info:
  title: Agent Sandbox API
  version: "1.0"
  description: >
    Manages the lifecycle of isolated, ephemeral agent execution environments.
paths:
  /sandboxes:
    post:
      summary: Create a sandbox
      description: >
        Creates sandbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Sandbox created.
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List sandboxes
      parameters:
        - name: page
          in: query
          required: true
          example: 0
          schema:
            type: integer
        - name: size
          in: query
          required: true
          example: 10
          schema:
            type: integer
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sandbox'

  /sandboxes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/parameters/SandboxId'
    get:
      summary: Provides sandbox details.
      responses:
        '200':
          description: Sandbox details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Deletes a sandbox.
      description: >
        Deletes sandbox metadata and its NFS storage.
      responses:
        '204':
          description: Sandbox deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An exec is in progress for this sandbox (SANDBOX_EXECUTING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sandboxes/{id}/exec:
    post:
      summary: Execute a command in a sandbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: Command output, streamed as Server-Sent Events from the container's stdout.
          content:
            text/event-stream:
              schema:
                type: string
              itemSchema:
                type: object
                required: [type, value]
                properties:
                  type:
                    type: string
                    enum: [stdout,stderr]
                  value:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another exec is already running for this sandbox (SANDBOX_EXECUTING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    SandboxId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateSandboxRequest:
      type: object
      required: 
        - id
        - image
      properties:
        id:
          type: string
          format: uuid
        image:
          type: string
          example: my-agentic-app-image

    Sandbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image:
          type: string

    ExecRequest:
      type: object
      required: 
        - command
      properties:
        command:
          type: string
          example: "python agent.py --prompt '{\"tools\":[],\"messages\":[...]}'"

    Error:
      type: object
      required: 
        - error
      properties:
        error:
          type: object
          required: 
            - code, 
            - message
          properties:
            code:
              type: string
              example: SANDBOX_NOT_FOUND
            message:
              type: string

  responses:
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: "Malformed request"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'